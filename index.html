<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>El Último en Pie Profe Ericka</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Nunito:wght@500;700;800;900&display=swap">
<style>
/* Proyector de aula: la compu de la profe muestra la pregunta en grande; los celulares son controles de 4 colores */
:root{
  --ink:#10192e; --panel:#1b2742; --deep:#0b1222; --line:#2e3d60; --chalk:#f3efe4; --mute:#9aa6c2;
  --a0:#e8553f; --a1:#2f8fd6; --a2:#e0a81e; --a3:#2e9e6b; --good:#4fd18b; --bad:#ef6a55; --warn:#f2c14e;
  --gold:#e0a81e; --silver:#b9c3d8; --bronze:#c98a5a;
  --display:"Bricolage Grotesque","Arial Black",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
html{background:var(--ink)}
body{background:var(--ink);color:var(--chalk);font-family:var(--body);font-size:16px;line-height:1.45}
[hidden]{display:none!important}
.wrap{max-width:1150px;margin:0 auto;padding-inline:16px;padding-block:18px 48px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.08;text-wrap:balance}
p{margin:0}
button{font:inherit;font-weight:800;cursor:pointer;border:0;border-radius:12px;padding:11px 18px;color:var(--chalk);background:var(--line)}
button:hover{filter:brightness(1.12)}
button:disabled{opacity:.4;cursor:not-allowed;filter:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
.go{background:var(--a2);color:var(--ink)}
.ghost{background:transparent;border:2px solid var(--line)}
.danger{background:var(--bad);color:var(--ink)}
.small{padding:6px 12px;font-size:14px;border-radius:9px}
input,select,textarea{font:inherit;color:var(--chalk);background:var(--deep);border:2px solid var(--line);border-radius:10px;padding:9px 12px;min-width:0}
textarea{width:100%;min-height:190px;resize:vertical;font-size:15px;line-height:1.5}
input::placeholder,textarea::placeholder{color:#64708e}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.muted{color:var(--mute)}
.hint{color:var(--mute);font-size:14px}
.err{color:var(--bad);min-height:1.4em;font-size:15px;font-weight:700}
.box{background:var(--panel);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.box h2{font-size:22px}
.step{font-family:var(--display);color:var(--a2)}
.brand{font-weight:800;font-size:clamp(26px,4vw,40px);letter-spacing:-.01em}
.brand span{color:var(--a2)}
.pinChip{display:flex;align-items:center;gap:10px;background:var(--deep);border:2px solid var(--line);border-radius:12px;padding:6px 14px;cursor:pointer;color:var(--chalk)}
.pinChip b{font-family:var(--display);font-size:24px;letter-spacing:.12em;font-variant-numeric:tabular-nums;color:var(--a2)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--good);display:inline-block;flex:none}
.dot.off{background:var(--line)}
code{background:var(--deep);border-radius:6px;padding:1px 6px;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--chalk);color:var(--ink);font-weight:800;padding:10px 18px;border-radius:12px;z-index:50;max-width:calc(100% - 32px)}

/* figuras y colores de respuesta */
.a0{background:var(--a0)}.a1{background:var(--a1)}.a2{background:var(--a2);color:var(--ink)}.a3{background:var(--a3)}
.shape{width:30px;height:30px;flex:none}

/* ---------- editor ---------- */
.edGrid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:18px;align-items:start}
@media (max-width:900px){.edGrid{grid-template-columns:1fr}}
.cards{display:flex;flex-direction:column;gap:12px}
.card{border:2px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--ink)}
.card.need{border-color:var(--warn)}
.cTop{display:flex;gap:10px;align-items:center}
.cNum{font-family:var(--display);font-weight:800;font-size:20px;color:var(--a2);min-width:2ch;font-variant-numeric:tabular-nums}
.cTop input{flex:1}
.pill{font-size:12px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;border-radius:999px;padding:3px 10px;white-space:nowrap}
.pill.ok{background:var(--good);color:var(--ink)}
.pill.no{background:var(--warn);color:var(--ink)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:560px){.opts{grid-template-columns:1fr}}
.opt{display:flex;align-items:center;gap:8px;border-radius:11px;padding:5px;background:var(--deep);border:2px solid transparent;min-width:0}
.opt.right{border-color:var(--good);background:#143326}
.opt input{flex:1;border:0;background:transparent;padding:6px 4px}
.opt .mk{width:38px;height:38px;border-radius:9px;display:grid;place-items:center;padding:0;flex:none}
.opt .mk svg{width:22px;height:22px}
.opt .tick{width:38px;height:38px;padding:0;border-radius:9px;background:transparent;border:2px solid var(--line);color:var(--mute);font-size:18px;flex:none}
.opt.right .tick{background:var(--good);border-color:var(--good);color:var(--ink)}
.cFoot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--mute)}
.cFoot select{padding:5px 8px;font-size:14px}
.empty{border:2px dashed var(--line);border-radius:14px;padding:26px;text-align:center;color:var(--mute)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters .on{background:var(--chalk);color:var(--ink)}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.pack{background:var(--ink);border:2px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.pack .pTitle{font-family:var(--display);font-size:18px;line-height:1.15;overflow-wrap:anywhere}
.pack .row{margin-top:auto;padding-top:4px;gap:6px}
.tag{align-self:flex-start;font-size:11px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:2px 9px;color:var(--ink)}
.t0{background:var(--a1);color:var(--chalk)}.t1{background:var(--a3);color:var(--chalk)}.t2{background:var(--a2)}.t3{background:var(--chalk)}
.saveRow input{flex:1;min-width:200px}
.sticky{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;z-index:5}

/* ---------- sala y juego (pantalla proyectada) ---------- */
.lobbyHead{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;background:var(--chalk);color:var(--ink);border-radius:20px;padding:20px 26px}
@media (max-width:700px){.lobbyHead{grid-template-columns:1fr}}
.lobbyHead .where{font-size:clamp(18px,2.4vw,26px);font-weight:800}
.lobbyHead .where b{font-family:var(--display)}
.bigPin{font-family:var(--display);font-weight:800;font-size:clamp(64px,11vw,130px);letter-spacing:.08em;line-height:1;font-variant-numeric:tabular-nums}
.people{display:flex;flex-wrap:wrap;gap:10px}
.person{display:flex;align-items:center;gap:8px;background:var(--panel);border-radius:999px;padding:8px 8px 8px 14px;font-weight:800;font-size:18px}
.person button{padding:2px 9px;border-radius:999px;font-size:13px;background:transparent;color:var(--mute)}
.person button:hover{color:var(--bad)}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;color:var(--mute);font-weight:800}
.bar .count{color:var(--chalk);font-size:20px}
.qtext{background:var(--chalk);color:var(--ink);border-radius:18px;padding:26px 22px;text-align:center;font-family:var(--display);font-weight:800;font-size:clamp(24px,4.2vw,50px);overflow-wrap:anywhere}
.mid{display:flex;align-items:center;justify-content:center;gap:24px;flex-wrap:wrap}
.clock{width:118px;height:118px;position:relative;flex:none}
.clock svg{width:100%;height:100%;transform:rotate(-90deg)}
.clock b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:44px;font-variant-numeric:tabular-nums}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:14px;flex:1;min-width:min(100%,520px)}
@media (max-width:640px){.answers{grid-template-columns:1fr}}
.ans{position:relative;display:flex;align-items:center;gap:14px;border-radius:16px;padding:18px 20px;font-size:clamp(18px,2.5vw,28px);font-weight:900;min-height:82px;overflow:hidden;transition:opacity .3s}
.ans .shape{width:40px;height:40px}
.ans .txt{min-width:0;overflow-wrap:anywhere;position:relative}
.ans.dim{opacity:.3}
.ans.win{box-shadow:0 0 0 5px var(--chalk)}
.ans .n{margin-left:auto;font-family:var(--display);font-size:30px;position:relative;font-variant-numeric:tabular-nums}
.board{display:flex;flex-direction:column;gap:10px;max-width:780px;width:100%;margin:0 auto}
.brow{display:grid;grid-template-columns:3ch minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--panel);border-radius:14px;padding:13px 18px;font-size:22px;font-weight:900}
.brow .pos{font-family:var(--display);color:var(--a2);font-variant-numeric:tabular-nums}
.brow .nm{overflow-wrap:anywhere}
.brow .pts{font-family:var(--display);font-variant-numeric:tabular-nums}
.brow .delta{color:var(--good);font-size:16px;margin-right:12px}
.center{text-align:center;justify-content:center}
.big{font-size:clamp(32px,5.5vw,60px)}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:14px;margin-top:16px}
.pstep{width:min(210px,30vw);display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.pstep .name{font-weight:900;font-size:clamp(15px,2.4vw,24px);text-align:center;overflow-wrap:anywhere}
.pstep small{color:var(--mute);font-weight:800;font-variant-numeric:tabular-nums}
.pstep .block{width:100%;border-radius:14px 14px 0 0;display:grid;place-items:center;font-family:var(--display);font-size:48px;color:var(--ink)}
.p1 .block{height:220px;background:var(--gold)}.p2 .block{height:160px;background:var(--silver)}.p3 .block{height:110px;background:var(--bronze)}
.race{display:flex;flex-direction:column;gap:7px;max-width:1000px;width:100%;margin:0 auto}
.raceWrap{max-height:68vh;overflow-y:auto;padding-right:4px}
.lane{display:grid;grid-template-columns:2.8em minmax(0,1fr) 5.2em;gap:10px;align-items:center}
.lane .pos{font-family:var(--display);font-weight:800;font-size:20px;color:var(--a2);text-align:right;font-variant-numeric:tabular-nums}
.lane .lpts{font-family:var(--display);font-weight:800;font-size:18px;text-align:right;font-variant-numeric:tabular-nums;line-height:1.05}
.lane .lpts small{display:block;font-family:var(--body);font-size:12px;color:var(--good)}
.track{position:relative;height:44px;border-radius:12px;background:#283247;border-top:3px solid #3d4a66;border-bottom:3px solid #3d4a66}
.track::before{content:"";position:absolute;left:10px;right:20px;top:50%;height:2px;margin-top:-1px;background:repeating-linear-gradient(90deg,rgba(243,239,228,.45) 0 14px,transparent 14px 28px)}
.track::after{content:"";position:absolute;right:0;top:0;bottom:0;width:14px;border-radius:0 9px 9px 0;background:repeating-conic-gradient(var(--chalk) 0 25%,var(--ink) 0 50%) 0 0/14px 14px}
.track{--carw:82px}
.runner{position:absolute;top:50%;left:calc((100% - var(--carw)) * var(--x,0));transform:translateY(-50%);transition:left 1.8s cubic-bezier(.2,.8,.2,1)}
.final .runner{transition-duration:3s}
.car{width:64px;height:32px;display:block;filter:drop-shadow(0 2px 2px rgba(0,0,0,.45))}
.car.c0{color:#e8553f}.car.c1{color:#2f8fd6}.car.c2{color:#e0a81e}.car.c3{color:#2e9e6b}.car.c4{color:#b07ad9}.car.c5{color:#f08bb4}.car.c6{color:#5fc9d6}.car.c7{color:#f3efe4}
.runner.moving .car{animation:vroom .18s linear infinite}
.car .wh{transform-box:fill-box;transform-origin:center}
.runner.moving .car .wh{animation:spin .35s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.final:not(.done) .lpts{opacity:0}
.final .lpts{transition:opacity .6s}
.final .pos{transition:transform .4s}
.lane.arrived .pos{animation:medal .6s ease-out}
@keyframes medal{0%{transform:scale(.2)}70%{transform:scale(1.5)}100%{transform:scale(1)}}
.lane.arrived .track{box-shadow:0 0 0 3px var(--gold)}
.lane.out{opacity:.75}
.runner.crashed .car{animation:crash .8s ease-out forwards}
@keyframes crash{0%{transform:rotate(0)}35%{transform:translateY(-10px) rotate(220deg)}70%{transform:translateY(2px) rotate(170deg)}100%{transform:translateY(3px) rotate(180deg);filter:grayscale(.85) brightness(.6)}}
.boom{position:absolute;left:32px;top:50%;font-size:32px;line-height:1;pointer-events:none;animation:boom 1.4s ease-out forwards}
@keyframes boom{0%{transform:translate(-50%,-50%) scale(.2)}25%{transform:translate(-50%,-50%) scale(1.7)}100%{transform:translate(-50%,-60%) scale(1);opacity:.85}}
.smoke{position:absolute;left:20px;top:0;font-size:20px;opacity:0;animation:smoke 2.4s ease-out .5s infinite}
@keyframes smoke{0%{transform:translate(0,0) scale(.6);opacity:.8}100%{transform:translate(-14px,-22px) scale(1.4);opacity:0}}
.finTitle{transition:transform .5s}
.finTitle.win{animation:medal .7s ease-out}
.podium{margin-top:6px}
.pstep .car{width:96px;height:48px}
.pstep .medal{font-size:40px;line-height:1}
.pstep .name{font-size:clamp(16px,2.4vw,24px)}
.pstep .block{font-size:44px;transform-origin:bottom}
.pstep.p1 .name{color:var(--gold)}
.pstep.me .name::after{content:" (usted)";color:var(--mute);font-size:.7em}
.podium.show .pstep{animation:podIn .5s ease-out both}
.podium.show .pstep .block{animation:rise .8s cubic-bezier(.2,.9,.3,1.2) both}
.podium.show .p3,.podium.show .p3 .block{animation-delay:0s}
.podium.show .p2,.podium.show .p2 .block{animation-delay:.5s}
.podium.show .p1,.podium.show .p1 .block{animation-delay:1s}
@keyframes rise{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes podIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@media (max-width:560px){
  .podium{gap:8px}
  .pstep .car{width:60px;height:30px}.pstep .medal{font-size:28px}
  .p1 .block{height:120px}.p2 .block{height:88px}.p3 .block{height:62px}.pstep .block{font-size:30px}
}
.phone>*{min-width:0}
.hero{min-width:0;position:relative;border-radius:22px;overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,#24365f 0%,var(--ink) 72%);padding:26px 16px 0;text-align:center;border:2px solid var(--line)}
.hero::before{content:"";position:absolute;left:0;right:0;top:0;height:12px;background:repeating-conic-gradient(var(--chalk) 0 25%,var(--ink) 0 50%) 0 0/12px 12px}
.hTop{font-family:var(--display);font-weight:800;letter-spacing:.22em;font-size:clamp(14px,4vw,18px);color:var(--chalk);margin-top:8px}
.hMain{display:inline-block;font-family:var(--display);font-weight:800;font-style:italic;font-size:clamp(44px,15vw,92px);line-height:1;white-space:nowrap;max-width:100%;letter-spacing:-.01em;transform:skewX(-9deg);background:linear-gradient(180deg,#ffe27a 0%,#e0a81e 55%,#e8553f 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #0b1222);position:relative;padding:.06em .4em .1em .25em}
.hMain::before,.hMain::after{content:"";position:absolute;top:30%;width:.7em;height:.07em;border-radius:9px;background:var(--a2);box-shadow:0 .16em 0 var(--a0),0 .32em 0 var(--a2);opacity:.8}
.hMain::before{right:100%}.hMain::after{left:100%}
.hChip{display:inline-block;margin-top:12px;background:var(--a0);color:var(--chalk);font-weight:900;letter-spacing:.14em;font-size:14px;padding:5px 14px;border-radius:999px;transform:rotate(-2deg);box-shadow:0 3px 0 #8e2a1c}
.road{position:relative;height:104px;margin:20px -16px 0;background:#283247;border-top:4px solid #3d4a66}
.road::before{content:"";position:absolute;left:0;right:0;top:50%;height:3px;margin-top:-1.5px;background:repeating-linear-gradient(90deg,rgba(243,239,228,.55) 0 22px,transparent 22px 44px);animation:roadmove .6s linear infinite}
@keyframes roadmove{to{background-position:-44px 0}}
.road::after{content:"";position:absolute;right:0;top:0;bottom:0;width:16px;background:repeating-conic-gradient(var(--chalk) 0 25%,var(--ink) 0 50%) 0 0/16px 16px}
.rcar{position:absolute;width:84px;height:42px;animation:drive var(--d,5s) linear infinite;animation-delay:var(--dl,0s)}
.rcar .car{width:84px;height:42px}
.rcar .wh{animation:spin .3s linear infinite}
.rcar.l1{top:4px}.rcar.l2{top:56px}
@keyframes drive{from{left:-100px}to{left:calc(100% + 20px)}}
.pairChk{display:flex!important;align-items:center;gap:10px;text-transform:none!important;letter-spacing:0!important;font-size:16px!important;color:var(--chalk)!important;cursor:pointer;margin:6px 0 2px}
.pairChk input{width:22px!important;height:22px;accent-color:var(--a2);flex:none}
#pairBox{display:flex;flex-direction:column;gap:6px}
#pairBox[hidden]{display:none}
.join .codeIn{border-color:var(--a2);box-shadow:0 0 0 4px rgba(224,168,30,.15)}
.joinTitle{font-family:var(--display);font-weight:800;font-size:24px;text-align:center}
.myCar{display:flex;flex-direction:column;align-items:center;gap:6px}
.myCar .car{width:150px;height:75px}
.dblBadge{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(90deg,#ffe27a,#e0a81e);color:var(--ink);font-weight:900;border-radius:999px;padding:4px 12px;letter-spacing:.04em;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.qtext.dbl,.sQ.dbl{box-shadow:0 0 0 5px var(--a2),0 0 30px rgba(224,168,30,.5)}
.dblSplash{position:fixed;inset:0;z-index:45;display:grid;place-items:center;text-align:center;padding:16px;background:radial-gradient(circle at 50% 45%,#3a2a06 0%,rgba(11,18,34,.96) 65%)}
.dblSplash .in{display:flex;flex-direction:column;gap:10px;align-items:center;animation:zoomIn .5s cubic-bezier(.2,.9,.3,1.3) both}
.dblSplash .x2{font-family:var(--display);font-weight:800;font-style:italic;font-size:clamp(90px,26vw,220px);line-height:.9;background:linear-gradient(180deg,#ffe27a,#e0a81e 55%,#e8553f);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 0 #0b1222)}
.dblSplash h2{font-size:clamp(26px,6vw,54px)}
.dblSplash p{font-weight:800;font-size:clamp(16px,2.6vw,24px);color:var(--chalk)}
.dblSplash .bolt{font-size:clamp(40px,8vw,80px);animation:pulse .5s ease-in-out infinite}
@keyframes zoomIn{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
.picker{display:flex;flex-direction:column;gap:12px;width:100%}
.picker h3{font-size:18px;text-align:center}
.pickRow{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.pickRow button{padding:6px 2px;border-radius:12px;background:var(--deep);border:3px solid transparent}
.pickRow button[aria-pressed="true"]{border-color:var(--a2);background:#2a3a63}
.pickRow .car{width:100%;height:auto;aspect-ratio:2/1}
.swatches{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.swatches button{aspect-ratio:1;border-radius:50%;padding:0;border:3px solid var(--deep);min-width:0}
.swatches button[aria-pressed="true"]{border-color:var(--chalk);box-shadow:0 0 0 3px var(--a2)}
.person .car{width:44px;height:22px}
.fast{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;background:linear-gradient(90deg,rgba(224,168,30,.18),rgba(224,168,30,.05));border:2px solid var(--a2);border-radius:14px;padding:10px 14px;font-weight:900;font-size:clamp(16px,2.4vw,24px);text-align:center}
.fast .car{width:64px;height:32px}
.fast b{color:var(--a2)}
.lane.bluff .rn{animation:bluff .5s ease-in-out 3}
@keyframes bluff{50%{background:var(--a2);color:var(--ink)}}
.crowd{display:flex;justify-content:center;gap:clamp(4px,2vw,12px);font-size:clamp(28px,8vw,46px);padding:26px 8px 16px;margin:18px -16px 0;background:#283247;border-top:4px solid #3d4a66}

const Q_PREFIX = /^\s*(?:(?:pregunta|preg\.?)\s*\d+\s*[\)\.\-:]?|\d+\s*[\)\.\-:])\s*/i;
function blankQ(){ return { q:"", a:["","","",""], c:-1, t:20 }; }
// quita la marca de correcta (* al inicio o al final, ✓, (x)) y la viñeta o letra
function readOpt(raw){
  let star = false, s = raw.trim();
  s = s.replace(/^\*+\s*/, () => { star = true; return ""; });
  s = s.replace(OPT_PREFIX, "");
  s = s.replace(/^\*+\s*/, () => { star = true; return ""; });
  s = s.replace(/\s*(?:\*+|\(\s*(?:x|correcta)\s*\)|✓|✔)\s*$/i, () => { star = true; return ""; });
  return { s: s.trim(), star };
}
function parseQuestions(text){
  const out = [], warn = [];
  const lines = String(text||"").replace(/\r/g,"").split("\n");
  let cur = null, blockStart = true;
  const nOpts = q => q.a.filter(x => x).length;
  const push = () => { if(cur && cur.q) out.push(cur); cur = null; };
  const newQ = line => { push(); cur = blankQ(); cur.q = line.replace(Q_PREFIX, "").trim(); };
  const addOpt = line => {
    const o = readOpt(line); if(!o.s) return;
    const n = nOpts(cur);
    if(n >= 4){ if(!cur.warned){ cur.warned = 1; warn.push("«" + cur.q.slice(0,40) + "» tenía más de 4 opciones; dejé las primeras 4."); } return; }
    cur.a[n] = o.s; if(o.star) cur.c = n;
  };
  for(const raw of lines){
    const line = raw.trim();
    if(!line){ blockStart = true; continue; }
    // formato de una línea: pregunta; opción; opción; ... ; letra correcta (opcional)
    if((line.match(/;/g)||[]).length >= 2){
      push();
      const p = line.split(";").map(x => x.trim()).filter(Boolean);
      const q = blankQ(); q.q = p[0].replace(Q_PREFIX, "").trim();
      let rest = p.slice(1), letter = -1;
      const last = (rest[rest.length-1]||"").toUpperCase();
      if(/^[ABCD]$/.test(last)){ letter = LETTERS.indexOf(last); rest = rest.slice(0,-1); }
      if(rest.length > 4) warn.push("«" + q.q.slice(0,40) + "» tenía más de 4 opciones; dejé las primeras 4.");
      rest.slice(0,4).forEach((x,i) => { const o = readOpt(x); q.a[i] = o.s; if(o.star) q.c = i; });
      if(letter >= 0 && letter < Math.min(rest.length,4)) q.c = letter;
      if(q.q) out.push(q);
      blockStart = true; continue;
    }
    const bare = line.replace(/^\*+\s*/, "");
    const isOpt = OPT_PREFIX.test(bare) && !Q_PREFIX.test(bare) && !/\?\s*$/.test(line);
    const looksQ = /\?\s*$/.test(line) || /^¿/.test(line) || Q_PREFIX.test(line);
    if(!cur){ if(isOpt) continue; newQ(line); }
    else if(isOpt) addOpt(line);
    else if(looksQ) newQ(line);
    else if(nOpts(cur) === 0){ if(blockStart) newQ(line); else addOpt(line); }
    else if(blockStart || nOpts(cur) >= 4) newQ(line);
    else addOpt(line);
    blockStart = false;
  }
  push();
  out.forEach(q => { delete q.warned; if(nOpts(q) < 2) warn.push("«" + q.q.slice(0,40) + "» tiene menos de 2 opciones; complétela abajo."); });
  return { qs: out, warn };
}
const qReady = q => q.q.trim() && q.a.filter(o => o.trim()).length >= 2 && q.c >= 0 && (q.a[q.c]||"").trim();

function packToQs(pack){
  return pack.qs.map(([q, opts, t]) => {
    const idx = opts.map((_,i) => i);
    for(let i = idx.length - 1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [idx[i], idx[j]] = [idx[j], idx[i]]; }

  });

// cada jugador: color = su número de entrada y el modelo va cambiando, así no se repiten (hasta 40 distintos)
function carSVG(i){
  if(i && typeof i === "object") return carSVG.pick((+i.t || 0) % CAR_TYPES.length, (+i.c || 0) % 8);
  const color = i % 8, type = (i + Math.floor(i / 8)) % CAR_TYPES.length;
  return carSVG.pick(type, color);
}
carSVG.pick = (type, color) => {
  return `<svg class="car c${color}" viewBox="0 0 80 40" aria-hidden="true">${CAR_TYPES[type]}</svg>`;
};
// el carro por defecto de cada jugador según su orden de entrada
const defaultCar = i => ({ t:(i + Math.floor(i / 8)) % CAR_TYPES.length, c:i % 8 });
const cleanCar = c => (c && typeof c === "object" && Number.isInteger(+c.t) && Number.isInteger(+c.c)) ? { t:Math.abs(+c.t) % 5, c:Math.abs(+c.c) % 8 } : null;

function raceScale(list, qn, nq, final){
  const lead = Math.max(1, ...list.map(p => p.total));
  if(final) return lead;                                   // al final el primero cruza la meta
  const frac = Math.min(1, qn / Math.max(1, nq));
  return Math.max(lead, 1000 * qn) / (0.15 + 0.85 * frac);  // avanzan un poco en cada pregunta
}
function raceHTML(list, opts){
  const o = opts || {}, scale = o.scale || 1;
  const ini = n => (String(n).trim()[0] || "?").toUpperCase();
  return `<div class="race ${o.final ? "final" : ""}">
    <div class="raceHead"><span>Salida</span><span>Meta 🏁</span></div>
    ${list.map((p,k) => {
      const to = Math.min(1, p.total / scale), from = o.final ? 0 : Math.min(1, Math.max(0, p.total - (p.pts||0)) / scale);
      if(o.final) return `<div class="lane ${o.me === p.name ? "me" : ""}" data-rank="${k}">
        <span class="pos"></span>
        <div class="track"><div class="runner ${k < 3 ? "flip" : ""}" style="--x:0">
          ${carSVG(p.car || (p.color ?? k))}<span class="rn">${esc(p.name)}${o.me === p.name ? " (usted)" : ""}</span></div></div>
        <span class="lpts">${p.total}</span>
      </div>`;
      return `<div class="lane ${o.me === p.name ? "me" : ""}">
        <span class="pos">${(k+1) + "°"}</span>
        <div class="track"><div class="runner ${to > .6 ? "flip" : ""}" style="--x:${from.toFixed(4)}" data-to="${to.toFixed(4)}">
          ${carSVG(p.car || (p.color ?? k))}<span class="rn">${esc(p.name)}${o.me === p.name ? " (usted)" : ""}</span></div></div>
        <span class="lpts">${p.total}${p.pts ? `<small>+${p.pts}</small>` : ""}</span>
      </div>`;
    }).join("")}
  </div>`;
}
// la gran final: el 3° va adelante, lo pasa el 2° y al final el 1° rebasa a todos; los demás chocan
function raceFinale(race, done){
  const lanes = [...race.querySelectorAll(".lane")];
  const D = 7000;
  const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  const L = x => `calc((100% - var(--carw)) * ${x})`;
  const at = (ms, fn) => setTimeout(fn, reduce ? 0 : ms);
  // posición de cada uno de los 3 primeros en cada momento de la carrera
  const PLAN = [
    [[0,0],[.2,.14],[.5,.42],[.72,.9],[.84,1]],   // 1°: sale lento y rebasa a todos al final
    [[0,0],[.2,.24],[.5,.62],[.72,.8],[.92,1]],   // 2°: pasa al 3° a media carrera
    [[0,0],[.2,.34],[.5,.56],[.72,.74],[1,1]]     // 3°: arranca adelante y llega de último
  ];
  const arrive = (lane, k) => {
    lane.classList.add("arrived"); lane.querySelector(".pos").textContent = MEDALS[k];
    beep([1047,880,784][k], 180, "triangle");
  };
  const crash = (lane, x) => {
    const r = lane.querySelector(".runner");
    r.style.setProperty("--x", x); r.classList.add("crashed");
    r.insertAdjacentHTML("beforeend", '<span class="boom">💥</span><span class="smoke">💨</span>');
    lane.classList.add("out"); lane.querySelector(".pos").textContent = (+lane.dataset.rank + 1) + "°";
    beep(110, 260, "sawtooth"); setTimeout(() => beep(70, 300, "square"), 60);
  };
  lanes.forEach(lane => {
    const k = +lane.dataset.rank, r = lane.querySelector(".runner");
    r.style.transition = "none";
    if(k < 3){
      const plan = PLAN[k];
      if(reduce){ r.style.setProperty("--x", 1); arrive(lane, k); return; }
      r.classList.add("moving");
      const anim = r.animate(plan.map(([t,x]) => ({ offset:t, left:L(x) })), { duration:D, easing:"linear", fill:"forwards" });
      anim.onfinish = () => { r.style.setProperty("--x", 1); r.classList.remove("moving"); };
      at(plan[plan.length-1][0] * D, () => arrive(lane, k));
    } else {
      const tc = .22 + Math.random() * .38, xc = (.18 + Math.random() * .42).toFixed(3);
      if(reduce){ crash(lane, xc); return; }
      r.classList.add("moving");
      r.animate([{ offset:0, left:L(0) }, { offset:1, left:L(xc) }], { duration:tc * D, easing:"ease-in", fill:"forwards" });
      at(tc * D, () => { r.classList.remove("moving"); crash(lane, xc); });
    }
  });
  at(D + 400, () => { race.classList.add("done"); if(done) done(); });
}

// confeti para el final
function confetti(){
  if(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = document.createElement("canvas"); c.className = "confetti"; document.body.appendChild(c);
  const ctx = c.getContext("2d"), W = c.width = innerWidth, H = c.height = innerHeight;
  const cols = ["#e8553f","#2f8fd6","#e0a81e","#2e9e6b","#f3efe4","#b07ad9"];
  const ps = Array.from({ length:160 }, () => ({ x:W/2 + (Math.random()-.5)*W*.3, y:H*.35, vx:(Math.random()-.5)*14, vy:-Math.random()*14-4, s:5+Math.random()*6, r:Math.random()*6, vr:(Math.random()-.5)*.3, c:cols[Math.floor(Math.random()*cols.length)] }));
  const t0 = performance.now();
  const step = now => {
    const t = now - t0; ctx.clearRect(0,0,W,H);
    ps.forEach(p => { p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.globalAlpha = Math.max(0, 1 - t/3500); ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); ctx.restore(); });
    if(t < 3500) requestAnimationFrame(step); else c.remove();
  };
  requestAnimationFrame(step);
}

    if(fin){ raceFinale(fin, done); const me0 = document.querySelector(".lane.me"); if(me0 && me0.scrollIntoView) me0.scrollIntoView({ block:"nearest" }); return; }
    raceBluff([...document.querySelectorAll(".race:not(.final) .runner[data-to]")]);

  }));

// marcador con engaño: un carro de atrás arranca y pasa a todos… pero al final cada uno queda en su lugar real
function raceBluff(runners){
  if(!runners.length) return;
  const L = x => `calc((100% - var(--carw)) * ${x})`;
  const info = runners.map(r => ({ r, from:+r.style.getPropertyValue("--x") || 0, to:+r.dataset.to }));
  const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  const moved = info.some(i => Math.abs(i.to - i.from) > .002);
  if(reduce || !moved || !runners[0].animate){ info.forEach(i => i.r.style.setProperty("--x", i.to)); return; }
  const lead = Math.max(...info.map(i => i.to));
  // el que engaña: alguien del 2° al 4° lugar (los carriles ya vienen ordenados por puesto)
  const b = info.length > 1 ? 1 + Math.floor(Math.random() * Math.min(3, info.length - 1)) : -1;
  if(b > 0) info[b].r.closest(".lane").classList.add("bluff");
  info.forEach((it, k) => {
    const d = it.to - it.from;
    const mid = k === b ? Math.min(1, Math.max(it.to, lead) + .07) : (k === 0 && b > 0 ? it.from + d * .3 : it.from + d * .6);
    it.r.style.transition = "none"; it.r.classList.add("moving");
    const a = it.r.animate([{ left:L(it.from) }, { left:L(mid), offset:.5 }, { left:L(it.to) }], { duration:3000, easing:"ease-in-out", fill:"forwards" });
    a.onfinish = () => { it.r.style.setProperty("--x", it.to); it.r.classList.remove("moving"); };
  });
}

// la gran caída: caen en el orden en que fueron eliminados (los últimos tres despacio),
// cada uno pasa ordenado al cementerio, y al final el ganador sube al podio a bailar
function runFinale(done){
  const stage = $("stage"), cem = $("cem"), cemWrap = $("cemWrap");
  const figs = stage ? [...stage.querySelectorAll(".fig")] : [];
  if(!figs.length){ if(done) done(); return; }
  const win = figs.find(f => f.dataset.win === "1") || figs[0];
  const losers = figs.filter(f => f !== win).sort((a,b) => (+a.dataset.out || 999) - (+b.dataset.out || 999) || Math.random() - .5);
  const toGrave = f => {
    if(cemWrap) cemWrap.hidden = false;
    if(cem) cem.insertAdjacentHTML("beforeend", graveHTML(f.dataset.name, f.dataset.av, f.dataset.out, f.classList.contains("me")));
    f.remove();
  };
  const finish = () => {
    if(stage){ stage.classList.add("gone"); setTimeout(() => { stage.hidden = true; }, 600); }
    if(done) done();
  };
  const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(reduce){ losers.forEach(toGrave); finish(); return; }
  const n = losers.length, fast = Math.max(260, Math.min(700, 7000 / Math.max(1, n)));
  let t = 1400;
  losers.forEach((f, i) => {
    setTimeout(() => {
      f.classList.add("dead");
      f.insertAdjacentHTML("beforeend", '<span class="fboom">💥</span>');
      beep(120 + Math.random()*80, 200, "sawtooth");
      setTimeout(() => toGrave(f), 950);
    }, t);
    t += (n - i) <= 3 ? 1300 : fast;
  });
  // queda uno solo: se corona en el escenario y después sube al podio
  setTimeout(() => { stage.classList.add("won"); win.classList.add("winner", "king"); beep(660,150,"triangle"); setTimeout(() => beep(990,220,"triangle"), 160); }, t + 800);
  setTimeout(finish, t + 2600);
}

function hOnData(c, d){
  if(!d || typeof d !== "object") return;
  const s = H.s;
  if(d.t === "join"){
    const name = String(d.name||"").replace(/\s+/g," ").trim().slice(0,52);
    const cid = String(d.cid||"").replace(/[^a-z0-9]/gi,"").slice(0,40);
    if(!name || !cid){ c.send({t:"rejected", msg:"Escriba su nombre para entrar."}); return; }
    let p = s.players[cid];
    if(!p){
      const same = Object.entries(s.players).find(([,x]) => x.name.toLowerCase() === name.toLowerCase() && !isOn(x));
      if(same){
        const [oldId, rec] = same; delete s.players[oldId]; s.players[cid] = rec; p = rec;
        if(s.ans[oldId]){ s.ans[cid] = s.ans[oldId]; delete s.ans[oldId]; }
      } else {
        const taken = new Set(Object.values(s.players).map(x => x.name.toLowerCase()));
        let nm = name, k = 2; while(taken.has(nm.toLowerCase())) nm = name + " " + (k++);
        p = s.players[cid] = { name:nm, total:0, streak:0 };
        p.av = (d.av != null && Number.isInteger(+d.av) && +d.av >= 0 && +d.av < AVATARS.length) ? +d.av : (Object.keys(s.players).length - 1) % AVATARS.length;
        if(s.phase !== "lobby" && s.qi >= 0) p.out = s.qi + 1; // si entra con el juego empezado, mira como espectador
        beep(700,90);
      }
    }
    c.open = true; c._cid = cid; H.conns[cid] = c; p.seen = Date.now(); p.lastAt = Date.now();
    hSave();
    c.send({ t:"welcome", name:p.name });
    if(s.phase === "question" && s.ans[cid]) c.send({ t:"got", qn:s.qi+1, choice:s.ans[cid].c });
    if((s.phase === "reveal" || s.phase === "board") && p.last && p.last.qn === s.qi+1) c.send(hResultMsg(cid));
    if(s.phase === "end" && s.podium) c.send({ t:"podium", list:s.podium, me:p.name });
    hRenderPeople(); hBroadcast();
    return;
  }
  const cid = c._cid || String(d.cid||""); const p = s.players[cid];
  if(!p){ c.send({ t:"kicked" }); return; }
  c._cid = cid;
  const wasOn = isOn(p); p.seen = Date.now(); p.lastAt = Date.now();
  if(!wasOn){ hRenderPeople(); hBroadcast(); }
  if(d.t === "ping") return;
  if(d.t === "av"){ const v = +d.av; if(Number.isInteger(v) && v >= 0 && v < AVATARS.length){ p.av = v; hSave(); hRenderPeople(); hBroadcast(); } return; }
  if(d.t === "car"){ const c = cleanCar(d.car); if(c){ p.car = c; hSave(); hRenderPeople(); hBroadcast(); } return; }
  if(d.t === "answer"){
    const q = s.qs[s.qi];
    if(s.phase !== "question" || d.qn !== s.qi+1 || !q) return;
    const ch = +d.choice;
    if(!(ch >= 0 && ch < 4) || !(q.a[ch]||"").trim()) return;
    if(Date.now() < s.startedAt || p.out) return;
    if(!s.ans[cid]){ s.ans[cid] = { c:ch, ms:Math.max(0, Date.now() - s.startedAt) }; hSave(); hRenderCount(); }
    c.send({ t:"got", qn:s.qi+1, choice:s.ans[cid].c });
    hCheckAllAnswered();
  }
}

/* --- flujo del juego --- */
function hOpenLobby(){
  const ready = QS.filter(qReady);
  if(!ready.length){ toast("Primero marque la respuesta correcta de al menos una pregunta."); return; }
  const s = H.s;
  s.qs = JSON.parse(JSON.stringify(ready)); s.qi = -1; s.phase = "lobby"; s.ans = {}; s.podium = null;
  // preguntas sorpresa: 3 al azar (nunca la primera) valen el doble y tienen la mitad del tiempo
  const nDbl = 0; // en este juego no hay preguntas dobles
  const pool = s.qs.map((_,i) => i).slice(1);
  for(let i = pool.length - 1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
  s.qs.forEach(q => delete q.double);
  pool.slice(0, nDbl).forEach(i => s.qs[i].double = true);
  Object.values(s.players).forEach(p => { p.total = 0; p.streak = 0; p.last = null; p.out = 0; p.tms = 0; });
  s.elim = []; s.saved = false;
  s.nBase = s.qs.length; s.sdRound = 0; s.sdUsed = []; s.slow = null;
  H.view = "game"; hSave(); hBroadcast(); hRender();
}
function hNext(){
  const s = H.s;
  if(s.qi >= 0 && aliveCount() <= 1){ hEnd(); return; }
  if(s.qi >= s.qs.length - 1) hAddSuddenDeath(); // se acabaron las preguntas y quedan varios: ¡muerte súbita!
  s.qi++; s.phase = "question"; s.ans = {}; s.elim = []; s.saved = false; s.slow = null;
  const dq = s.qs[s.qi], base = dq.t || 20;
  s.dur = dq.sd ? Math.max(6, Math.round(base / 2)) : Math.max(8, base - Math.floor(s.qi / 2)); // el tiempo baja poco a poco
  s.startedAt = Date.now() + (dq.double || dq.sd ? DBL_INTRO : 0); // la doble se anuncia unos segundos antes
  hSave(); hBroadcast(); hRender(); beep(660,120); setTimeout(()=>beep(880,160),130);
}
const DBL_INTRO = 3200;
// agrega una pregunta extra (del mismo quiz, al azar) para la muerte súbita
function hAddSuddenDeath(){
  const s = H.s, n = s.nBase || s.qs.length;
  if(!Array.isArray(s.sdUsed) || s.sdUsed.length >= n) s.sdUsed = [];
  const left = Array.from({ length:n }, (_,i) => i).filter(i => !s.sdUsed.includes(i));
  const pick = left[Math.floor(Math.random() * left.length)];
  s.sdUsed.push(pick);
  const q = JSON.parse(JSON.stringify(s.qs[pick]));
  // revolver las opciones para que no la contesten de memoria
  const idx = q.a.map((_,i) => i).filter(i => (q.a[i]||"").trim());
  for(let i = idx.length - 1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [idx[i], idx[j]] = [idx[j], idx[i]]; }
  const a = idx.map(i => q.a[i]); while(a.length < 4) a.push("");
  q.c = idx.indexOf(q.c); q.a = a; q.sd = true; delete q.double;
  s.sdRound = (s.sdRound || 0) + 1;
  s.qs.push(q);
}
const hQLabel = () => { const s = H.s, q = s.qs[s.qi]; return q && q.sd ? "⚔️ Muerte súbita · ronda " + s.sdRound : "Pregunta " + (s.qi+1) + " de " + (s.nBase || s.qs.length); };
function hResultMsg(cid){
  const s = H.s, p = s.players[cid], q = s.qs[s.qi];
  return { t:"result", ...p.last, total:p.total||0, alive:aliveCount(), of:Object.keys(s.players).length, correct:q.c, correctText:q.a[q.c], fast:s.fast || null };
}
function hReveal(){
  const s = H.s; if(s.phase !== "question") return;
  clearInterval(H.tick); clearTimeout(H.allT);
  const q = s.qs[s.qi], qn = s.qi + 1;
  const alive = Object.entries(s.players).filter(([,p]) => !p.out);
  const failed = alive.filter(([cid]) => !(s.ans[cid] && s.ans[cid].c === q.c));
  // si todos los que seguían en pie fallan, nadie queda eliminado
  s.saved = failed.length > 0 && failed.length === alive.length;
  s.elim = s.saved ? [] : failed.map(([,p]) => p.name);
  Object.entries(s.players).forEach(([cid,p]) => {
    if(p.out){ p.last = { qn, spectator:true, ok:false, choice:-1, answered:false }; return; }
    const a = s.ans[cid], ok = !!a && a.c === q.c;
    if(ok){ p.total = (p.total||0) + 1; p.tms = (p.tms||0) + a.ms; }
    const outNow = !ok && !s.saved;
    if(outNow) p.out = qn;
    p.last = { qn, ok, choice:a ? a.c : -1, answered:!!a, outNow, saved:!ok && s.saved };
  });
  if(q.sd && !s.saved){
    const right = Object.entries(s.players).filter(([cid,p]) => !p.out && s.ans[cid] && s.ans[cid].c === q.c);
    if(right.length >= 2){
      right.sort((a,b) => s.ans[b[0]].ms - s.ans[a[0]].ms);
      const sp = right[0][1];
      sp.out = qn; sp.last.outNow = true; sp.last.slow = true;
      s.slow = sp.name; s.elim = s.elim.concat([sp.name]);
    }
  }
  const fastId = Object.keys(s.ans).filter(id => s.ans[id].c === q.c && s.players[id]).sort((a,b) => s.ans[a].ms - s.ans[b].ms)[0];
  s.fast = fastId ? { qn, name:s.players[fastId].name, sec:+(s.ans[fastId].ms/1000).toFixed(1), av:s.players[fastId].av ?? 0 } : null;
  s.phase = "reveal"; hSave(); hBroadcast(); hRender();
  if(s.elim.length){ beep(180,260,"sawtooth"); setTimeout(() => beep(110,420,"sawtooth"), 220); }
  else { beep(520,110); setTimeout(() => beep(780,220), 120); }
  onlineIds().forEach(cid => connFor(cid).send(hResultMsg(cid)));
}
function hBoard(){ H.s.phase = "board"; hSave(); hBroadcast(); hRender(); }
function hEnd(){
  const s = H.s; s.phase = "end";
  s.podium = ranked().map(p => ({ name:p.name, out:p.out||0, total:p.total||0, av:p.av ?? 0 }));
  hSave(); hBroadcast(); hRender();
  onlineIds().forEach(cid => connFor(cid).send({ t:"podium", list:s.podium, me:s.players[cid].name }));
}
function hKick(cid){
  const c = connFor(cid); c.send({ t:"kicked" }); delete H.s.players[cid]; delete H.s.ans[cid];
  hSave(); hRenderPeople(); hBroadcast();
}

    ${s.slow ? `<div class="elimBox">🐢 <b>${esc(s.slow)}</b> acertó, pero cayó por ser el más lento</div>` : ""}

function hStartClock(){
  if(H.s.qs[H.s.qi] && (H.s.qs[H.s.qi].double || H.s.qs[H.s.qi].sd) && Date.now() < H.s.startedAt) dblSound();
  const s = H.s, C = 2*Math.PI*50; let lastSec = -1;
  const paint = () => {
    const left = s.dur - (Date.now() - s.startedAt)/1000;
    const sec = Math.min(s.dur, Math.max(0, Math.ceil(left)));
    const el = $("sec"); if(!el) return;
    if(left <= s.dur){ const sp = $("dblSplash"); if(sp) sp.remove(); }
    el.textContent = sec; $("arc").style.strokeDashoffset = C * (1 - Math.min(1, Math.max(0,left)/s.dur));
    if(sec !== lastSec){ lastSec = sec; if(sec <= 5 && sec > 0) beep(880,70,"square"); }
    if(left <= 0) hReveal();
  };
  paint(); clearInterval(H.tick); H.tick = setInterval(paint, 200);
}

// revisa que el PIN sea de un Último en Pie abierto antes de pedir el nombre
function sCheckPin(code, ok, fail){
  if(!NET.init()){ fail("No se pudo cargar el juego. Revise el internet."); return; }
  const t = setTimeout(() => fail("Problema de conexión a internet. Intente de nuevo."), 15000);
  NET.room(code).child("host").once("value").then(snap => {
    clearTimeout(t);
    const h = snap.val();
    if(!h) fail("No hay ningún juego con el PIN " + code + ". Revíselo o pida a la profe que abra el juego.");
    else if(h.game !== GAME) fail("El PIN " + code + " es de otro juego. Revise el PIN.");
    else ok();
  }).catch(e => { clearTimeout(t); console.error(e); fail("No se pudo revisar el PIN. Avise a la profe."); });
}
function sJoinFail(msg, badPin){ clearTimeout(S.openT); clearTimeout(S.retry); S.joined = false; if(badPin) S.pinOk = false; sJoinView(msg); }
function sStart(){
  if(!NET.init()){ sJoinFail("No se pudo cargar el juego. Revise el internet."); return; }
  if(S.room){ try{ S.room.child("state").off(); S.room.child("inbox/" + S.cid).off(); }catch(e){} }
  const room = NET.room(S.code);
  const failT = setTimeout(() => { if(!S.joined) sJoinFail("Problema de conexión a internet. Intente de nuevo."); }, 15000);
  room.child("host").once("value").then(snap => {
    clearTimeout(failT);
    const h = snap.val();
    if(!h){ sJoinFail("No hay ningún juego con el PIN " + S.code + ". Revíselo o pida a la profe que abra el juego.", true); return; }
    if(h.game !== GAME){ sJoinFail("El PIN " + S.code + " es de otro juego. Revise el PIN.", true); return; }
    S.room = room;
    room.child("inbox/" + S.cid).on("child_added", s2 => { const d = s2.val(); s2.ref.remove(); S.lastHeard = Date.now(); sOnData(d); });
    room.child("state").on("value", s2 => { const d = s2.val(); if(d){ S.lastHeard = Date.now(); S.st = d; if(S.joined) sOnState(d); } });
    S.attempts = 0; sConnect();
  }).catch(err => { clearTimeout(failT); console.error(err); sJoinFail("No se pudo entrar al juego. Avise a la profe."); });
}
function sConnect(){
  if(!S.room) return;
  S.attempts++;
  if(!S.car){ const c = ls.get("quiz_car", null); if(c) S.car = c; }
  if(S.av == null){ const v = ls.get("ultimo_av", null); if(v != null) S.av = v; }
  sSend({ t:"join", name:S.name, cid:S.cid, av:S.av ?? null });
  clearTimeout(S.openT);
  S.openT = setTimeout(() => {
    if(S.joined) return;
    if(S.attempts >= 4){ sJoinFail("La compu de la profe no responde. Revise el PIN y que la profe tenga el juego abierto.", true); return; }
    const b = $("joinBtn"); if(b) b.textContent = "Entrando… (intento " + (S.attempts+1) + ")";
    sConnect();
  }, 6000);
}
function sRetry(){ clearTimeout(S.retry); S.retry = setTimeout(() => { S.attempts = 0; S.lastHeard = Date.now(); sConnect(); }, 2500); }
function sSend(m){ if(!S.room) return; try{ S.room.child("toHost").push(clean({ cid:S.cid, d:m })); }catch(e){ console.error(e); } }

function sOnData(d){
  if(!d || typeof d !== "object") return;
  if(d.t === "welcome"){
    const first = !S.joined;
    clearTimeout(S.openT); S.joined = true; S.name = d.name;
    if(first){ if(S.st) sOnState(S.st); else sWait(); }
    return;
  }
  if(d.t === "rejected"){ sJoinFail(d.msg || "No se pudo entrar."); return; }
  if(d.t === "kicked"){ try{ S.room.child("state").off(); S.room.child("inbox/" + S.cid).off(); }catch(e){} S.room = null; sJoinFail("La profe lo sacó del juego."); return; }
  if(d.t === "got"){ S.got[d.qn] = true; S.sent[d.qn] = d.choice; clearTimeout(S.resendT); if(S.st && S.st.phase === "question" && S.st.qn === d.qn) sSentView(d.choice, true); return; }
  if(d.t === "result"){ S.result = d; if(S.st && S.st.phase === "reveal") sResultView(); return; }
  if(d.t === "podium"){ if(!$("podView")) sPodiumView(d); return; }
}
function sOnState(d){
  if(d.game !== GAME) return;
  const mine = (d.players||[]).find(p => p.name === S.name);
  if(d.phase === "lobby"){ S.result = null; S.sent = {}; S.got = {}; if(!$("waitView") || (S.av == null && !S.avShown && sMyAv() != null)){ S.avShown = sMyAv() != null; sWait(); } return; }
  if(d.phase === "question"){
    S.endsAt = Date.now() + (d.remaining||0)*1000; S.dur = d.dur || 20;
    const isNew = S.qn !== d.qn; S.qn = d.qn;
    if(isNew) S.result = null;
    if(mine && mine.out){ if(isNew || !$("specView")) sSpectator(d, mine); return; }
    if(S.sent[d.qn] !== undefined){ if(isNew || !$("sentView")) sSentView(S.sent[d.qn], !!S.got[d.qn]); }
    else if(isNew || (!$("pad") && !$("dblSplash"))) sPadView(d);
    return;
  }
  clearInterval(S.tick);
  if(d.phase === "reveal"){
    if(S.result && S.result.qn === d.qn){ if(!$("verdict")) sResultView(); }
    else if(!$("verdict")) sNoAnswerView(d, mine);
    return;
  }
  if(d.phase === "board"){ sBoardView(d); return; }
  if(d.phase === "end" && !$("podView")) sPodiumView({ list:(d.players||[]).slice().sort(byStanding), me:S.name });
}

    <div class="sOpts">${texts.map((t,j) => (t||"").trim() ? `<div class="sOpt ${j===correct?"right":(j===choice?"wrong":"")}">
      <span class="sw a${j}">${SHAPES[j]}</span><span class="t">${esc(t)}</span>
      ${j===correct ? '<span class="mk">✔</span>' : (j===choice ? '<span class="mk">✘</span>' : "")}</div>` : "").join("")}</div>`;
}
// quién sigue en pie, en el celular
function sBoardView(d){
  const list = (d.players||[]).slice().sort(byStanding), alive = list.filter(p => !p.out).length, me = list.find(p => p.name === S.name);
  app.innerHTML = `<div class="phone" id="boardView">${sHead()}
    <h2 style="font-size:30px;text-align:center">❤️ Quedan ${alive}</h2>
    ${me ? `<p class="center" style="text-align:center;font-weight:800;font-size:18px">${me.out ? "💀 Usted cayó en la pregunta " + me.out : "💪 ¡Usted sigue en pie!"}</p>` : ""}
    ${tilesHTML(list, d.qn, S.name)}
    <p class="center muted" style="text-align:center">${sQLabel(d)}. Prepárese para la siguiente.</p></div>`;
  const m = document.querySelector(".tile.me"); if(m && m.scrollIntoView) m.scrollIntoView({ block:"nearest" });
}
function sPodiumView(d){
  clearInterval(S.tick);
  const list = d.list || [], i = list.findIndex(p => p.name === (d.me || S.name)), me = list[i];
  const win = !!me && !me.out;
  app.innerHTML = `<div class="phone" id="podView">${sHead()}
    <h2 class="finTitle" id="finTitle" style="font-size:26px;text-align:center">💀 ¡Que caigan uno por uno!</h2>
    ${list.length ? stageHTML(list, S.name) : ""}
    <div class="verdict ${win ? "ok" : "none"}" id="podVerdict" hidden><div class="ic">${win ? "👑" : "💀"}</div>
      <h2>${win ? "¡Usted es el último en pie!" : me ? "Quedó en el puesto " + (i+1) + "°" : "¡Fin del juego!"}</h2>
      ${me ? `<p style="font-weight:800">${me.total} aciertos${me.out ? " · cayó en la pregunta " + me.out : ""}</p>` : ""}</div>
    ${list.length ? podiumAvHTML(list, S.name) : ""}
    <p class="center muted" style="text-align:center">¡Gracias por jugar!</p></div>`;
  runFinale(() => {
    const t = $("finTitle"), w = list[0];
    if(t && w) t.textContent = "👑 ¡" + w.name + " es el último en pie!";
    const v = $("podVerdict"); if(v) v.hidden = false;
    setTimeout(danceOnPodium, 500);
    if(win){ [660,880,1100,1320].forEach((f,k) => setTimeout(() => beep(f,160), k*120)); confetti(); }
  });
}

/* ---------- arranque ---------- */
if(typeof firebase === "undefined"){
  app.innerHTML = '<div class="phone"><div class="box center"><h1>El Último en Pie</h1><p>No se pudo cargar el juego. Revise la conexión a internet y recargue la página.</p></div></div>';
} else if(new URLSearchParams(location.search).has("profe")){
  teacherInit();
} else {
  studentInit();
}
</script>
